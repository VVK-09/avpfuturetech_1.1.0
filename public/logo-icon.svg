<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="avpGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B1E3D" />
      <stop offset="60%" stop-color="#1E63D6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#DCEBFF" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E63D6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Circle (clean navy-blue tone) -->
  <rect width="120" height="120" rx="28" fill="url(#avpGrad)" />

  <!-- Brain & Circuit Grid Lines -->
  <!-- Left Hemisphere Brain Lobes & Circuit Nodes -->
  <path d="M 46 34 C 36 34 26 42 26 54 C 26 62 30 68 36 72 C 34 76 34 82 38 86 C 42 90 48 90 52 86" 
        fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round" />
  
  <path d="M 44 46 C 36 48 34 56 38 62" 
        fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round" />
  
  <path d="M 36 72 L 48 72" 
        fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round" />

  <!-- Circuit nodes / dots -->
  <circle cx="26" cy="54" r="3" fill="#38BDF8" />
  <circle cx="36" cy="72" r="3" fill="#60A5FA" />
  <circle cx="38" cy="86" r="3" fill="#93C5FD" />
  <circle cx="48" cy="72" r="2.5" fill="#FFFFFF" />

  <!-- Circuit connection lines to center -->
  <line x1="26" y1="54" x2="38" y2="54" stroke="rgba(255,255,255,0.5)" stroke-width="1.8" stroke-dasharray="2 2"/>
  <line x1="38" y1="86" x2="50" y2="76" stroke="rgba(255,255,255,0.5)" stroke-width="1.8" stroke-dasharray="2 2"/>

  <!-- Ascending Rocket with Thrust Trails (Innovate / Launch) -->
  <!-- Exhaust Plume / Trail -->
  <path d="M 52 88 Q 50 102 46 106 Q 60 98 62 82 Z" fill="#F59E0B" opacity="0.9"/>
  <path d="M 54 86 Q 52 96 50 100 Q 58 94 60 82 Z" fill="#EF4444" opacity="0.9"/>
  <path d="M 55 84 Q 54 90 53 94 Q 57 90 58 82 Z" fill="#FDE047"/>

  <!-- Rocket Body -->
  <g transform="translate(14, -8) rotate(22 60 60)" filter="url(#softGlow)">
    <!-- Left Wing -->
    <path d="M 44 76 L 36 82 L 42 66 Z" fill="#93C5FD"/>
    <!-- Right Wing -->
    <path d="M 64 76 L 72 82 L 66 66 Z" fill="#60A5FA"/>
    <!-- Fuselage -->
    <path d="M 54 36 C 54 36 44 52 44 76 L 64 76 C 64 52 54 36 54 36 Z" fill="url(#rocketGrad)"/>
    <!-- Nose Cone tip -->
    <path d="M 54 36 C 52 40 48 48 48 54 L 60 54 C 60 48 56 40 54 36 Z" fill="#1E63D6"/>
    <!-- Porothole Glass -->
    <circle cx="54" cy="62" r="5" fill="#0B1E3D"/>
    <circle cx="54" cy="62" r="3.5" fill="#38BDF8"/>
    <circle cx="55.5" cy="60.5" r="1.2" fill="#FFFFFF"/>
  </g>

  <!-- Star sparkles -->
  <polygon points="86,30 88,35 93,37 88,39 86,44 84,39 79,37 84,35" fill="#FDE047" opacity="0.9"/>
  <polygon points="96,62 97,65 100,66 97,67 96,70 95,67 92,66 95,65" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="84" cy="78" r="2" fill="#60A5FA" opacity="0.8"/>
</svg>
